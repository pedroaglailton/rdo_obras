<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - IPQ Tecnologia</title>
<style>
  :root{--primary:#0f3d4c;--primary-dark:#0a2c37;--accent:#ff7a33;--bg:#f2f4f6;--card:#fff;--line:#e1e5ea;--text:#1c2b33;--muted:#68767f;--ok:#1f8a4c;--danger:#c6392f;--radius:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .box{background:var(--card);border-radius:16px;padding:32px;width:100%;max-width:400px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
  .box h1{text-align:center;color:var(--primary);margin:0 0 4px;font-size:24px}
  .box .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px}
  .badge-gestor{display:inline-block;background:#e3f2fd;color:#0f3d4c;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;background:#fbfcfd;color:var(--text);font-family:inherit}
  input:focus{outline:none;border-color:var(--primary);background:#fff}
  .btn{width:100%;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:11px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
  .btn:active{background:#e8621d}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .error{color:var(--danger);font-size:12px;text-align:center;margin-top:10px;min-height:18px}
  .hint{text-align:center;margin-top:18px;padding:14px;background:#f7f9fa;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
  .hint strong{color:var(--primary)}
</style>
</head>
<body>
<div class="box">
  <h1>IPQ Tecnologia</h1>
  <p class="sub">RDO de Campo &bull; <span class="badge-gestor">Acesso Restrito</span></p>
  <div id="f-login">
    <label>Email</label>
    <input type="text" id="email" placeholder="admin@ipq.com" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btnLogin" onclick="doLogin()">Entrar</button>
    <div class="error" id="e-login"></div>
    <div class="hint">
      <strong>🔒 Cadastro pelo gestor</strong><br>
      Usuários e equipes são criados exclusivamente no <strong>Painel Admin</strong> (aba Equipes/Usuários).<br>
      Procure o administrador da obra para liberar seu acesso.
    </div>
  </div>
</div>
<script>
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  if(!email||!senha){document.getElementById('e-login').textContent='Preencha email e senha';return;}
  const btn=document.getElementById('btnLogin');
  btn.disabled=true; btn.textContent='Entrando...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
    const d=await r.json();
    if(d.error){document.getElementById('e-login').textContent=d.error; btn.disabled=false; btn.textContent='Entrar'; return;}
    localStorage.setItem('token',d.token);
    localStorage.setItem('user',JSON.stringify(d.user));
    window.location.href=d.user.perfil==='gestor'?'/':'/app';
  }catch(e){document.getElementById('e-login').textContent='Erro de conexao'; btn.disabled=false; btn.textContent='Entrar';}
}
document.querySelectorAll('input').forEach(i=>i.addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();}));
// Atualiza Service Worker sem loop: só força update, não recarrega em loop
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update()));
}
</script>
</body>
</html>
