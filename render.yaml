# Blueprint do Render — crm-obras (IPQ Tecnologia)
# Deploy: Render > New + > Blueprint > selecione repo rdo_obras
services:
  # Serviço principal - CRM de Obras (código na raiz)
  - type: web
    name: crm-obras
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: TOKEN_SECRET
        generateValue: true
    healthCheckPath: /login
    # Para produção com dados persistentes, descomente o disco:
    # disk:
    #   name: crm-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
  # Serviço legado (mantido do repo original) - pode remover se não usar
  - type: web
    name: rdo-central
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DASHBOARD_USERS
        value: "Engenheiro:troque-esta-senha,Estagiario:troque-esta-tambem"
      - key: FISCAL_USERS
        value: "Fiscal:troque-esta-senha"
