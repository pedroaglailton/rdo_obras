
services:
  - type: web
    name: rdo-central
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DASHBOARD_USERS
        value: "Engenheiro:troque-esta-senha,Estagiario:troque-esta-tambem"
        # ↑ formato "Nome:senha,Nome2:senha2" — depois do deploy, vá em
        # "Environment" no painel do Render e troque pelos nomes e senhas
        # reais. Todas as contas aqui têm a mesma permissão no dashboard.
    # disk:
    #   name: rdo-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (se ativar o disco acima, adicione também esta env var:)
