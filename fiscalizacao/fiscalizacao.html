<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fiscalização de Obras · IPQ Tecnologia</title>
<style>
  :root{
    --primary:#1e6fd9; --bg:#f4f6f9; --card:#fff; --line:#e3e7ed; --text:#1c2530; --muted:#6b7684;
    --ok:#1f9d55; --ok-bg:#e6f7ec; --danger:#c6392f; --danger-bg:#fdecea; --warn:#b8860b; --warn-bg:#fff6e0;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:40px;}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:10;}
  header h1{font-size:17px;margin:0;}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  main{max-width:560px;margin:0 auto;padding:16px 14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=password],select,textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;background:#fff;color:var(--text);font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  input[type=file]{width:100%;font-size:13px;}
  .btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px;}
  .btn.ghost{background:var(--line);color:var(--text);}
  .btn.danger{background:var(--danger);}
  .btn:disabled{opacity:.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .toggle-group{display:flex;gap:8px;margin-top:2px;}
  .toggle-group button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;}
  .toggle-group button.sim.ativo{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);}
  .toggle-group button.nao.ativo{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
  .rdo-card{border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;}
  .rdo-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .rdo-card .tit{font-weight:700;font-size:14.5px;}
  .rdo-card .info{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;margin-top:8px;}
  .badge.pendente{background:var(--warn-bg);color:var(--warn);}
  .badge.aprovado{background:var(--ok-bg);color:var(--ok);}
  .badge.reprovado{background:var(--danger-bg);color:var(--danger);}
  .badge.ressalva{background:var(--warn-bg);color:var(--warn);}
  .declarado{font-size:12px;color:var(--muted);margin-top:6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:100;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .empty{text-align:center;padding:26px;color:var(--muted);font-size:13.5px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .top-actions .sync-info{font-size:12px;color:var(--muted);}
  .erro{background:var(--danger-bg);color:var(--danger);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px;}
  .checkfield{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;}
  .checkfield input{width:auto;}
  h2{font-size:15px;margin:0 0 6px;}
</style>
</head>
<body>

<header>
  <h1>🔎 Fiscalização de Obras</h1>
  <div class="sub" id="headerSub">Confere no local o que foi declarado nos RDOs</div>
</header>

<main>

  <!-- ===== Tela de login ===== -->
  <section class="card" id="telaLogin">
    <h2>Entrar</h2>
    <label>Endereço do servidor</label>
    <input type="text" id="cfgServidor" placeholder="https://rdo-obras.onrender.com">
    <label>Usuário</label>
    <input type="text" id="cfgUsuario" placeholder="Seu nome" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="cfgSenha" placeholder="Senha" autocomplete="current-password">
    <button class="btn" id="btnEntrar">Entrar</button>
    <div class="erro" id="erroLogin" style="display:none;"></div>
  </section>

  <!-- ===== Tela principal (lista de RDOs) ===== -->
  <div id="telaPrincipal" style="display:none;">

    <div class="top-actions">
      <span class="sync-info" id="usuarioLogado"></span>
      <span class="sync-info" id="pendentesInfo"></span>
    </div>

    <section class="card">
      <h2>Escolher local</h2>
      <label>Obra</label>
      <select id="selObra"></select>
      <label>Local</label>
      <select id="selLocal"></select>
      <div class="checkfield">
        <input type="checkbox" id="chkPendentes">
        <label style="margin:0;font-weight:500;color:var(--text);">Mostrar só RDOs ainda não vistoriados</label>
      </div>
      <button class="btn" id="btnBuscar">Buscar RDOs</button>
    </section>

    <section id="listaRdos"></section>

    <button class="btn ghost" id="btnSincronizar">⇅ Sincronizar vistorias</button>
    <button class="btn ghost" id="btnSair" style="background:transparent;color:var(--danger);">Sair</button>
  </div>

  <!-- ===== Tela de vistoria (formulário) ===== -->
  <div id="telaVistoria" style="display:none;">
    <section class="card">
      <h2>RDO selecionado</h2>
      <div class="info" id="resumoRdo"></div>
    </section>

    <form id="formVistoria" class="card">
      <label>Local confere com o declarado?</label>
      <div class="toggle-group" data-campo="local_confere">
        <button type="button" class="sim" data-val="sim">Sim</button>
        <button type="button" class="nao" data-val="nao">Não</button>
      </div>

      <div id="blocoSwitch" style="display:none;">
        <label>Switch foi conferido no local?</label>
        <div class="toggle-group" data-campo="switch_conferido">
          <button type="button" class="sim" data-val="sim">Sim</button>
          <button type="button" class="nao" data-val="nao">Não</button>
        </div>
        <label>Instalação do switch está OK?</label>
        <div class="toggle-group" data-campo="switch_ok">
          <button type="button" class="sim" data-val="sim">Sim</button>
          <button type="button" class="nao" data-val="nao">Não</button>
        </div>
      </div>

      <div id="blocoCamera" style="display:none;">
        <label>Câmera foi conferida no local?</label>
        <div class="toggle-group" data-campo="camera_conferida">
          <button type="button" class="sim" data-val="sim">Sim</button>
          <button type="button" class="nao" data-val="nao">Não</button>
        </div>
        <label>Instalação da câmera está OK?</label>
        <div class="toggle-group" data-campo="camera_ok">
          <button type="button" class="sim" data-val="sim">Sim</button>
          <button type="button" class="nao" data-val="nao">Não</button>
        </div>
      </div>

      <label>Fotos da vistoria (evidência)</label>
      <input type="file" id="f_fotosVistoria" accept="image/*" multiple>

      <label>Observações</label>
      <textarea id="f_observacoes" placeholder="Qualquer detalhe relevante..."></textarea>

      <label>Status geral da vistoria</label>
      <select id="f_status">
        <option value="aprovado">✅ Aprovado</option>
        <option value="aprovado_com_ressalva">⚠️ Aprovado com ressalva</option>
        <option value="reprovado">❌ Reprovado</option>
      </select>

      <button type="submit" class="btn">Salvar vistoria</button>
      <button type="button" class="btn ghost" id="btnCancelarVistoria">Cancelar</button>
    </form>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const CFG_KEY = 'fiscal_cfg';
  const FILA_KEY = 'fiscal_fila_vistorias';
  let rdosCarregados = [];
  let rdoSelecionado = null;

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  function getCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||'null'); }catch(e){ return null; } }
  function setCfg(c){ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
  function getFila(){ try{ return JSON.parse(localStorage.getItem(FILA_KEY)||'[]'); }catch(e){ return []; } }
  function setFila(f){ localStorage.setItem(FILA_KEY, JSON.stringify(f)); }

  function mostrarTela(nome){
    $('telaLogin').style.display = nome==='login' ? 'block' : 'none';
    $('telaPrincipal').style.display = nome==='principal' ? 'block' : 'none';
    $('telaVistoria').style.display = nome==='vistoria' ? 'block' : 'none';
  }

  // ---------------- Login ----------------
  $('btnEntrar').addEventListener('click', fazerLogin);
  $('cfgSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });

  async function fazerLogin(){
    const servidor = $('cfgServidor').value.trim().replace(/\/+$/,'');
    const usuario = $('cfgUsuario').value.trim();
    const senha = $('cfgSenha').value;
    if(!servidor || !usuario || !senha){ toast('Preencha todos os campos.'); return; }
    $('erroLogin').style.display='none';
    try{
      const resp = await fetch(servidor+'/api/fiscal/login', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario, senha})
      });
      const data = await resp.json();
      if(!resp.ok || !data.ok) throw new Error(data.erro || ('HTTP '+resp.status));
      setCfg({servidor, token: data.token, usuario: data.usuario});
      $('cfgSenha').value = '';
      iniciarPrincipal();
    }catch(err){
      $('erroLogin').style.display='block';
      $('erroLogin').textContent = 'Não foi possível entrar: ' + err.message;
    }
  }

  function sair(){
    const cfg = getCfg();
    if(cfg && cfg.token){
      fetch(cfg.servidor+'/api/fiscal/logout', { method:'POST', headers:{'x-fiscal-token':cfg.token} }).catch(()=>{});
    }
    localStorage.removeItem(CFG_KEY);
    mostrarTela('login');
  }
  $('btnSair').addEventListener('click', sair);

  function initFromStorage(){
    const cfg = getCfg();
    if(cfg && cfg.token){
      $('cfgServidor').value = cfg.servidor;
      $('cfgUsuario').value = cfg.usuario || '';
      iniciarPrincipal();
    }
  }

  // ---------------- Tela principal ----------------
  async function iniciarPrincipal(){
    mostrarTela('principal');
    const cfg = getCfg();
    $('usuarioLogado').textContent = '👤 ' + (cfg.usuario || '');
    atualizarPendentesInfo();
    await carregarObras();
  }

  function atualizarPendentesInfo(){
    const fila = getFila();
    $('pendentesInfo').textContent = fila.length ? `${fila.length} vistoria(s) pendente(s) de sincronizar` : 'Tudo sincronizado ✓';
  }

  async function apiFiscal(caminho, opts={}){
    const cfg = getCfg();
    const resp = await fetch(cfg.servidor + caminho, {
      ...opts,
      headers: { ...(opts.headers||{}), 'x-fiscal-token': cfg.token }
    });
    if(resp.status===401){ sair(); throw new Error('Sessão expirada. Faça login novamente.'); }
    const data = await resp.json();
    if(!resp.ok || !data.ok) throw new Error(data.erro || 'Erro na requisição');
    return data;
  }

  async function carregarObras(){
    try{
      const data = await apiFiscal('/api/fiscal/rdos');
      const obras = data.obras || [];
      $('selObra').innerHTML = '<option value="">Todas as obras</option>' +
        obras.map(o => `<option value="${o.nome}">${o.nome}</option>`).join('');
      $('selObra').dataset.obras = JSON.stringify(obras);
      atualizarLocais();
    }catch(err){ toast('Erro ao carregar obras: ' + err.message); }
  }

  function atualizarLocais(){
    const obras = JSON.parse($('selObra').dataset.obras || '[]');
    const obraSel = obras.find(o => o.nome === $('selObra').value);
    let locais = [];
    try{ locais = obraSel ? JSON.parse(obraSel.locais || '[]') : []; }catch(e){ locais = []; }
    $('selLocal').innerHTML = '<option value="">Todos os locais</option>' + locais.map(l => `<option value="${l}">${l}</option>`).join('');
  }
  $('selObra').addEventListener('change', atualizarLocais);

  $('btnBuscar').addEventListener('click', buscarRdos);

  async function buscarRdos(){
    const obra = $('selObra').value;
    const local = $('selLocal').value;
    const pendentes = $('chkPendentes').checked;
    const qs = new URLSearchParams();
    if(obra) qs.set('obra', obra);
    if(local) qs.set('local', local);
    if(pendentes) qs.set('pendentes', 'true');
    try{
      const data = await apiFiscal('/api/fiscal/rdos?' + qs.toString());
      rdosCarregados = data.rdos || [];
      renderLista();
    }catch(err){ toast('Erro ao buscar RDOs: ' + err.message); }
  }

  function statusFilaPara(uidRdo){
    return getFila().find(v => v.rdo_uid === uidRdo);
  }

  function renderLista(){
    const cont = $('listaRdos');
    if(!rdosCarregados.length){ cont.innerHTML = '<div class="empty">Nenhum RDO encontrado. Ajuste os filtros e busque de novo.</div>'; return; }
    cont.innerHTML = rdosCarregados.map(r => {
      const pendenteLocal = statusFilaPara(r.uid);
      let badge = '<span class="badge pendente">Ainda não vistoriado</span>';
      if(pendenteLocal){
        badge = '<span class="badge pendente">Vistoriado agora — aguardando sync</span>';
      } else if(r.vistoria_status){
        const map = { aprovado:['aprovado','Aprovado'], reprovado:['reprovado','Reprovado'], aprovado_com_ressalva:['ressalva','Aprovado c/ ressalva'] };
        const [cls, txt] = map[r.vistoria_status] || ['pendente', r.vistoria_status];
        badge = `<span class="badge ${cls}">${txt} · ${r.vistoria_fiscal||''}</span>`;
      }
      const declarado = [];
      if(r.switch_instalado === 'sim') declarado.push('Switch: ' + (r.switch_nomenclatura || 's/nome'));
      if(r.camera_instalada === 'sim') declarado.push('Câmera: ' + (r.camera_nomenclatura || 's/nome'));
      return `
        <div class="rdo-card">
          <div class="top">
            <div>
              <div class="tit">${r.local || '(sem local)'}</div>
              <div class="info">${r.obra_nome} · ${r.tecnico} · ${r.data_servico}</div>
              <div class="info">${r.atividade || ''}</div>
              ${declarado.length ? `<div class="declarado">Declarado: ${declarado.join(' · ')}</div>` : ''}
            </div>
          </div>
          ${badge}
          <button class="btn" style="margin-top:10px;" onclick="window.__abrirVistoria('${r.uid}')">Vistoriar</button>
        </div>`;
    }).join('');
  }

  // ---------------- Tela de vistoria ----------------
  window.__abrirVistoria = function(uid){
    rdoSelecionado = rdosCarregados.find(r => r.uid === uid);
    if(!rdoSelecionado) return;
    $('resumoRdo').innerHTML = `
      <strong>${rdoSelecionado.local}</strong> — ${rdoSelecionado.obra_nome}<br>
      Técnico: ${rdoSelecionado.tecnico} · Data: ${rdoSelecionado.data_servico}<br>
      Atividade: ${rdoSelecionado.atividade || '—'}<br>
      ${rdoSelecionado.switch_instalado==='sim' ? `Switch declarado: ${rdoSelecionado.switch_nomenclatura||'—'} (${rdoSelecionado.switch_local||'—'})<br>` : ''}
      ${rdoSelecionado.camera_instalada==='sim' ? `Câmera declarada: ${rdoSelecionado.camera_nomenclatura||'—'} (${rdoSelecionado.camera_local||'—'})<br>` : ''}
    `;
    $('blocoSwitch').style.display = rdoSelecionado.switch_instalado==='sim' ? 'block' : 'none';
    $('blocoCamera').style.display = rdoSelecionado.camera_instalada==='sim' ? 'block' : 'none';
    document.querySelectorAll('#formVistoria .toggle-group button').forEach(b => b.classList.remove('ativo'));
    $('f_observacoes').value = '';
    $('f_fotosVistoria').value = '';
    $('f_status').value = 'aprovado';
    mostrarTela('vistoria');
  };

  document.querySelectorAll('#formVistoria .toggle-group').forEach(grupo => {
    grupo.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if(!btn) return;
      grupo.querySelectorAll('button').forEach(b => b.classList.remove('ativo'));
      btn.classList.add('ativo');
    });
  });

  $('btnCancelarVistoria').addEventListener('click', () => mostrarTela('principal'));

  function valorToggle(campo){
    const btn = document.querySelector(`#formVistoria .toggle-group[data-campo="${campo}"] button.ativo`);
    return btn ? btn.dataset.val : '';
  }

  $('formVistoria').addEventListener('submit', function(e){
    e.preventDefault();
    if(!rdoSelecionado) return;

    const vistoria = {
      uid: 'v_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
      rdo_uid: rdoSelecionado.uid,
      data_vistoria: new Date().toISOString().slice(0,10),
      local_confere: valorToggle('local_confere'),
      switch_conferido: valorToggle('switch_conferido'),
      switch_ok: valorToggle('switch_ok'),
      camera_conferida: valorToggle('camera_conferida'),
      camera_ok: valorToggle('camera_ok'),
      observacoes: $('f_observacoes').value.trim(),
      qtd_fotos: $('f_fotosVistoria').files.length,
      status: $('f_status').value,
      lat: null, lon: null
    };

    function salvarNaFila(){
      const fila = getFila();
      fila.push(vistoria);
      setFila(fila);
      atualizarPendentesInfo();
      toast('Vistoria salva ✓ — sincronize quando tiver sinal.');
      mostrarTela('principal');
      buscarRdos();
    }

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos => { vistoria.lat = pos.coords.latitude; vistoria.lon = pos.coords.longitude; salvarNaFila(); },
        () => salvarNaFila(),
        { timeout: 4000 }
      );
    } else {
      salvarNaFila();
    }
  });

  // ---------------- Sincronização ----------------
  $('btnSincronizar').addEventListener('click', sincronizar);

  async function sincronizar(){
    const fila = getFila();
    if(!fila.length){ toast('Nada pendente pra sincronizar.'); return; }
    const btn = $('btnSincronizar');
    const textoOriginal = btn.textContent;
    btn.textContent = 'Sincronizando...'; btn.disabled = true;
    try{
      const data = await apiFiscal('/api/fiscal/sync', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ vistorias: fila })
      });
      setFila([]);
      atualizarPendentesInfo();
      toast(`Sincronizado: ${data.vistorias_recebidas} vistoria(s) ✓`);
      buscarRdos();
    }catch(err){
      toast('Falha ao sincronizar: ' + err.message);
    }finally{
      btn.textContent = textoOriginal; btn.disabled = false;
    }
  }

  initFromStorage();
})();
</script>

</body>
</html>
